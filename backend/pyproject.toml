[project]
name = "magister-simulacros"
version = "0.1.0"
description = "Magister simulacros de formacion comercial (Retell)"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.136.1",
    "slowapi==0.1.9",
    "uvicorn[standard]==0.47.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "email-validator==2.3.0",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pgvector==0.4.2",
    "redis==7.4.0",
    "boto3==1.43.9",
    "httpx==0.28.1",
    "PyJWT==2.12.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.28",
    "structlog==25.5.0",
    "apscheduler==3.11.2",
    "openai==2.37.0",
    "openai-agents==0.17.2",
    "langgraph==1.2.0",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg[binary,pool]==3.3.4",
    "google-auth==2.53.0",
    "google-api-python-client==2.196.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.13",
    "mypy==2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
